name: Сборка и публикация Nova Swim

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Проверка и сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Проверить PHP и комплект сборки
        run: |
          find dist -name '*.php' -print0 | xargs -0 -n1 php -l
          test -s dist/index.html
          test -s dist/mail.php
          test -s dist/phpmailer/PHPMailer.php
          test -s dist/.htaccess
          test ! -e dist/config.php
          test ! -e dist/mail-config.php
          test ! -e dist/.env
          bash -n deploy/activate.sh
          python3 deploy/check-mail.py
          node deploy/check-form.mjs
          python3 deploy/check-deploy.py
          tar -czf nova-swim-release.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nova-swim-release
          path: nova-swim-release.tar.gz
          retention-days: 14

  deploy:
    name: Публикация на Timeweb
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: nova-swim-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nova-swim-release
          path: /tmp/nova-swim-release
      - name: Проверить актуальность коммита main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current" = "$GITHUB_SHA"
      - name: Настроить SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Загрузить и опубликовать сборку
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_STATE: ${{ vars.DEPLOY_STATE }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 deploy/ship.py /tmp/nova-swim-release/nova-swim-release.tar.gz
      - name: Удалить SSH-ключ из runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
